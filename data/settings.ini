# Slay the Scarlet settings. Every value below is the current default, and any line can
# be removed to keep the default. The defaults are provisional until playtesting.
# An unknown section or setting is an error, so a typo cannot silently do nothing.
# These are the same settings as in game: press F7 and choose Settings.

[draft]
# Building the starting deck. Each pick offers 3 cards and adds one, until the deck is full: 20
# picks, or fewer with the starter below.

# true shows the deck so far while drafting. false makes it a blind draft.
show_deck=true

# Which card type each offer is:
#   weighted       each type about as often as the others
#   one_of_each    every set of offers shows a system card, a skill, and a spell, then repeats
#   random         every card as likely as any other, so system cards, the most numerous, come up most
card_types=weighted

[starter]
# true starts each draft from set cards for the character: 2 copies each of Spiritual Strike
# Talisman and Divine Raiment of the Dragon Fish, a default skill and a spell card. The picks
# fill the rest of the deck. false starts the draft from an empty deck.
enabled=false

[reward]
# The card offer after each match: replace (a card comes in and as many leave) or skip (no offers).
mode=replace

# When you get an offer, from your own result: both (after every match), winner (only if you win),
# or loser (only if you lose). With no offer your deck stays unchanged.
who_picks=both

# Which card type each offer is, as in [draft].
card_types=weighted

# Which of the cards offered comes in: choose (the player picks) or random (one is picked for them).
# With random here and replacement=random below, the swap happens by itself.
offer_pick=choose

# For replace: choose (specific cards), by_type (a type, then random cards of it) or random.
replacement=choose

# Seconds to take an offer, up to 90, 0 for no limit (the default, for now). When it runs out, any
# choices already made are kept and the rest are made at random; the deck screen then moves on by
# itself after 15 seconds. The time spent is saved, so closing the game does not reset it.
time_limit=0

# true: a pick made at random (offer_pick=random, or a time limit running out before an offer was
# chosen) is shown by the cursor running through the offers and slowing down onto it. The confirm
# button skips it. false shows the result straight away. Only an animation: the pick is made first and
# is the same either way, so this is not a rule, and runs carry on when it changes.
roulette=true

[netplay]
# Online, when both players have the mod: after a match, each sees the cards the other's deck gained
# and lost, once both have taken their rewards (the first to finish waits for the other). Only when
# both players have it on. Not a rule, so runs carry on when it changes.
share_changes=false

# When spectating, show the cards each player's deck gained and lost between matches. Not a rule.
spectator_changes=true

[run]
# How many matches a run lasts, up to 20. 0: no limit (endless). The last match gives no offer,
# since its card would never be played: the run ends and shows its score.
matches=0

# A set seed for events: a word of letters, digits, - and _ (up to 24; capitals count). With one,
# every player on a character gets the same draft, and starting over gives the same draft back.
# Blank: random. The score screen shows it, with the rules fingerprint and how often the run was
# started over.
seed=

# What happens when a run was made under different rules from these. true: the player may carry
# on under these rules, if their deck is legal under them. false: they can only start over.
allow_rule_changes=false

# Which of the character's four decks a run deck takes over while in use: 1 (green), 2 (red),
# 3 (blue) or 4 (yellow). Your own deck stays safe in your profile and comes back when the run stops.
# Not a rule, so runs carry on when it changes.
deck=1
