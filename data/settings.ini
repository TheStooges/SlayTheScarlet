# Slay the Scarlet settings. Every value below is the current default, and any line can
# be removed to keep the default. The defaults are provisional until playtesting.
# An unknown section or setting is an error, so a typo cannot silently do nothing.
# Most settings can also be changed in game: press F7 and choose Settings.

[deck]
# Legal deck size.
size_min=20
size_max=20

# Most copies of one card a deck may hold. It cannot go above 4 for now.
copy_limit=4

[draft]
# Building the starting deck. Each pick adds one card, until the deck is full: 20 picks, or fewer
# with the starter below.

# How many cards each pick offers. The screen fits up to 3.
offers=3

# true shows the deck so far while drafting. false makes it a blind draft.
show_deck=true

# Which card type each offer is:
#   random         every card as likely as any other, so system cards, the most numerous, come up most
#   weighted       each type about as often as the others
#   mostly_system, mostly_skill, mostly_spell
#                  that type in two offers out of three
#   one_of_each    every set of offers shows a system card, a skill, and a spell, then repeats
card_types=weighted

[starter]
# true starts each draft from set cards for the character: 2 copies each of Spiritual Strike
# Talisman and Divine Raiment of the Dragon Fish, a default skill and a spell card. The picks
# fill the rest of the deck. false starts the draft from an empty deck.
enabled=false

[reward]
# The card offer after each match: add, replace, remove or skip.
# add and remove need size_min below size_max.
mode=replace

# When you get an offer, from your own result: both (after every match), winner (only if you win),
# loser (only if you lose), or random (a chance, win or lose). With no offer your deck stays unchanged.
who_picks=both

# For random: the chance of an offer after each match, out of 100.
random_chance=50

# How many cards each offer shows. The screen fits up to 3.
offers=3

# How many copies of the card an offer gives, chosen at random in this range.
copies_min=1
copies_max=1

# Which card type each offer is, as in [draft].
card_types=weighted

# Which of the cards offered comes in: choose (the player picks) or random (one is picked for them).
# With random here and replacement=random below, the swap happens by itself.
offer_pick=choose

# For replace: choose (specific cards), by_type (a type, then random cards of it) or random.
replacement=choose

[netplay]
# What the opponent sees of your picks: hidden, after_confirm or live. Not used yet.
pick_visibility=after_confirm

# How the opponent's deck is shown: change (only what changed) or full. Not used yet.
opponent_deck=change

[items]
# Double-edged items. Not used yet.
enabled=false

[run]
# How many matches a run lasts, up to 20. 0: no limit (endless). The last match gives no offer,
# since its card would never be played: the run ends and shows its score.
matches=0

# What happens when a run was made under different rules from these. true: the player may carry
# on under these rules, if their deck is legal under them. false: they can only start over.
allow_rule_changes=false
