# Slay the Scarlet settings. Every value below is the current default, and any line can
# be removed to keep the default. The defaults are provisional until playtesting.
# An unknown section or setting is an error, so a typo cannot silently do nothing.

[deck]
# Legal deck size.
size_min=20
size_max=20

# Most copies of one card a deck may hold. It cannot go above 4 for now.
copy_limit=4

[draft]
# Building the starting deck: how many picks it takes.
picks=20

# How many cards each pick offers.
offers=3

# true shows the deck so far while drafting. false makes it a blind draft.
show_deck=true

# How many copies of the card each pick adds, chosen at random in this range.
# If copies_min is above 1, copies_min must equal copies_max.
copies_min=1
copies_max=1

# Which card types can be offered. Any of: system, skill, spell
types=system,skill,spell

# weighted (each offer rolls a card type using the weights below) or one_of_each
# (every set of offers shows a system card, a skill and a spell, then repeats if there are more).
offer_style=weighted

# How often each type is offered, relative to the others. weighted only; 0 turns a type off.
# The type is rolled first, so system cards are not favoured for being the most numerous.
system_weight=1
skill_weight=1
spell_weight=1

[starter]
# true starts each draft from the cards below, and the picks fill the rest of the deck.
# false starts the draft from an empty deck.
enabled=false

# Cards every character starts with, as card IDs. A card listed twice is two copies.
# 0 Spiritual Strike Talisman, 13 Divine Raiment of the Dragon Fish
common=0,0,13,13

# Cards each character starts with, on top of common: by default 2 copies of a default skill
# and 2 of a spell. An empty value adds nothing. IDs differ per character: spell 200 is a
# different card for Reimu and Marisa.
# d236 Hakurei Amulet, Spirit Sign "Fantasy Orb"
reimu=100,100,200,200
# d22 Grand Stardust, Star Sign "Meteonic Shower"
marisa=102,102,208,208
# d236 Magic Star Sword, Silver Sign "Silver Bound"
sakuya=102,102,206,206
# d623 Volatile Doll, Curse Sign "Shanghai Doll"
alice=101,101,202,202
# d421 Dew Spear, Fire Metal Sign "St Elmo's Pillar"
patchouli=104,104,200,200
# d22 Medium's Bind, Human Sign "Slash of Present"
youmu=103,103,200,200
# d236 Demon Lord Walk, Critical "Heart Break"
remilia=100,100,201,201
# d236 Light of the Undead, Death Sign "Ghastly Dream"
yuyuko=101,101,200,200
# d236 Open, Lamented Box of Urashima, Boundary "Border Between 2D and 3D"
yukari=100,100,202,202
# d623 Gnome -Dense-, Gather Sign "Throwing Mt. Togakushi"
suika=101,101,200,200
# d214 Illusionary Blast, Charming Look "Corolla Vision"
reisen=101,101,200,200
# d214 Domination Dash, Whirl Sign "Maple Leaf Fan"
aya=101,101,200,200
# d623 Bound Spirits of the Earth, Nautical Sign "Flow of the River"
komachi=101,101,200,200
# d214 Electrostatic Guided Missile, Electric Sign "Thunder Drum Shot"
iku=103,103,200,200
# d236 Beams of Non-Perception, Earth Sign "Sword of Unletting Soil"
tenshi=102,102,200,200
# d236 Wind-Call, Omikuji "Random Omikuji Barrage"
sanae=100,100,203,203
# d22 Little Iceberg, Ice Sign "Icicle Machine Gun"
cirno=102,102,200,200
# d236 Fragrant Wave, Color Sign "Colorful Windchime"
meiling=103,103,200,200
# d236 Ground Melt, Burning Star "Fixed Star"
utsuho=101,101,203,203
# d214 Ancient Geyser, Spring Sign "Moriya Clear Water"
suwako=100,100,201,201

[reward]
# The card offer after each match: add, replace, remove or skip.
# add and remove need size_min below size_max.
mode=replace

# both, winner, loser or nobody (an offer is rolled at random for both players).
# A player who is left out keeps their deck unchanged.
who_picks=both

# How many cards each offer shows.
offers=3

# How many copies of the card an offer gives, chosen at random in this range.
copies_min=1
copies_max=1

# Which card types can be offered. Any of: system, skill, spell
types=system,skill,spell

# offer_style and the weights work as in [draft].
offer_style=weighted

system_weight=1
skill_weight=1
spell_weight=1

# For replace: choose (specific cards), by_type (a type, then random cards of it) or random.
replacement=choose

[netplay]
# What the opponent sees of your picks: hidden, after_confirm or live. Not used yet.
pick_visibility=after_confirm

# How the opponent's deck is shown: change (only what changed) or full. Not used yet.
opponent_deck=change

[items]
# Double-edged items. Not used yet.
enabled=false

[run]
# What happens when a run was made under different rules from these. true: the player may carry
# on under these rules, if their deck is legal under them. false: they can only start over.
allow_rule_changes=false
