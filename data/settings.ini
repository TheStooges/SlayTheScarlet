# Slay the Scarlet settings. Every value below is the current default, and any line can
# be removed to keep the default. The defaults are provisional until playtesting.
# An unknown section or setting is an error, so a typo cannot silently do nothing.

[deck]
# Legal deck size.
size_min=20
size_max=20

# Most copies of one card a deck may hold. It cannot go above 4 for now.
copy_limit=4

[draft]
# Building the starting deck: how many picks it takes.
picks=20

# How many cards each pick offers.
offers=3

# true shows the deck so far while drafting. false makes it a blind draft.
show_deck=true

# How many copies of the card each pick adds, chosen at random in this range.
# If copies_min is above 1, copies_min must equal copies_max.
copies_min=1
copies_max=1

# Which card types can be offered. Any of: system, skill, spell
types=system,skill,spell

# weighted (each offer rolls a card type using the weights below) or one_of_each
# (every set of offers shows a system card, a skill and a spell, then repeats if there are more).
offer_style=weighted

# How often each type is offered, relative to the others. weighted only; 0 turns a type off.
# The type is rolled first, so system cards are not favoured for being the most numerous.
system_weight=1
skill_weight=1
spell_weight=1

[reward]
# The card offer after each match: add, replace, remove or skip.
# add and remove need size_min below size_max.
mode=replace

# both, winner, loser or nobody (an offer is rolled at random for both players).
# A player who is left out keeps their deck unchanged.
who_picks=both

# How many cards each offer shows.
offers=3

# How many copies of the card an offer gives, chosen at random in this range.
copies_min=1
copies_max=1

# Which card types can be offered. Any of: system, skill, spell
types=system,skill,spell

# offer_style and the weights work as in [draft].
offer_style=weighted

system_weight=1
skill_weight=1
spell_weight=1

# For replace: choose (specific cards), by_type (a type, then random cards of it) or random.
replacement=choose

[netplay]
# What the opponent sees of your picks: hidden, after_confirm or live. Not used yet.
pick_visibility=after_confirm

# How the opponent's deck is shown: change (only what changed) or full. Not used yet.
opponent_deck=change

[items]
# Double-edged items. Not used yet.
enabled=false

[run]
# What happens when a run was made under different rules from these. true: the player may carry
# on under these rules, if their deck is legal under them. false: they can only start over.
allow_rule_changes=false
